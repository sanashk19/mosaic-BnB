<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" fill="none">
  <!-- Tubeteika (skullcap) -->
  <ellipse cx="100" cy="48" rx="34" ry="10" fill="#1e3a8a"/>
  <path d="M66 48 Q66 28 100 28 Q134 28 134 48" fill="#1e3a8a"/>
  <!-- Tubeteika pattern -->
  <circle cx="84" cy="42" r="2.5" fill="#f59e0b"/>
  <circle cx="100" cy="36" r="2.5" fill="#dc2626"/>
  <circle cx="116" cy="42" r="2.5" fill="#10b981"/>
  <!-- Hair (braids) -->
  <path d="M70 60 Q60 90 56 130 Q54 150 60 165" stroke="#3f1f0a" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M130 60 Q140 90 144 130 Q146 150 140 165" stroke="#3f1f0a" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Face -->
  <ellipse cx="100" cy="70" rx="28" ry="32" fill="#fce7d4"/>
  <!-- Eyes -->
  <circle cx="89" cy="68" r="3" fill="#1f2937"/>
  <circle cx="111" cy="68" r="3" fill="#1f2937"/>
  <circle cx="90" cy="67" r="1" fill="white"/>
  <circle cx="112" cy="67" r="1" fill="white"/>
  <!-- Eyebrows -->
  <path d="M82 60 Q89 58 96 60" stroke="#3f1f0a" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M104 60 Q111 58 118 60" stroke="#3f1f0a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Cheeks -->
  <circle cx="83" cy="80" r="4" fill="#f9a8d4" opacity="0.5"/>
  <circle cx="117" cy="80" r="4" fill="#f9a8d4" opacity="0.5"/>
  <!-- Mouth (smile) -->
  <path d="M93 85 Q100 92 107 85" stroke="#a83232" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Earrings -->
  <circle cx="72" cy="76" r="2" fill="#f59e0b"/>
  <circle cx="128" cy="76" r="2" fill="#f59e0b"/>
  <!-- Neck -->
  <rect x="92" y="98" width="16" height="14" fill="#fce7d4"/>
  <!-- White inner shirt -->
  <path d="M80 112 L120 112 L122 165 L78 165 Z" fill="#ffffff"/>
  <!-- Chapan (coat) ikat pattern -->
  <path d="M60 112 Q70 110 80 112 L80 200 L60 200 Z" fill="#0e7490"/>
  <path d="M120 112 Q130 110 140 112 L140 200 L120 200 Z" fill="#0e7490"/>
  <!-- Ikat pattern stripes -->
  <path d="M64 130 L76 130 M64 150 L76 150 M64 170 L76 170" stroke="#7c3aed" stroke-width="3"/>
  <path d="M64 140 L76 140 M64 160 L76 160 M64 180 L76 180" stroke="#fbbf24" stroke-width="2"/>
  <path d="M124 130 L136 130 M124 150 L136 150 M124 170 L136 170" stroke="#7c3aed" stroke-width="3"/>
  <path d="M124 140 L136 140 M124 160 L136 160 M124 180 L136 180" stroke="#fbbf24" stroke-width="2"/>
  <!-- Gold trim -->
  <path d="M80 112 L80 165 M120 112 L120 165" stroke="#f59e0b" stroke-width="2"/>
  <!-- Right arm (extended in welcoming gesture) -->
  <path d="M60 130 Q35 145 30 175" stroke="#0e7490" stroke-width="22" stroke-linecap="round"/>
  <circle cx="30" cy="175" r="9" fill="#fce7d4"/>
  <!-- Left arm holding book -->
  <path d="M140 130 Q160 150 158 180" stroke="#0e7490" stroke-width="22" stroke-linecap="round"/>
  <!-- Book -->
  <rect x="148" y="170" width="22" height="28" rx="2" fill="#10b981"/>
  <rect x="151" y="173" width="16" height="2" fill="#065f46"/>
  <rect x="151" y="178" width="10" height="2" fill="#065f46"/>
  <!-- White pants -->
  <path d="M78 200 L80 270 L98 270 L100 215 L102 270 L120 270 L122 200 Z" fill="#ffffff"/>
  <!-- Shoes -->
  <ellipse cx="89" cy="270" rx="12" ry="6" fill="#0e7490"/>
  <ellipse cx="111" cy="270" rx="12" ry="6" fill="#0e7490"/>
</svg>
